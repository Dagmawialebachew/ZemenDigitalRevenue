[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "zemen-digital-commerce"
version = "1.0.2"
description = "Zemen Digital commerce engine — bot, backend, workers, Mini App, and control room."
requires-python = ">=3.12"
dependencies = [
  "aiogram==3.30.0",
  "fastapi==0.140.8",
  "uvicorn[standard]==0.51.0",
  "pydantic-settings==2.14.2",
  "asyncpg>=0.30.0,<1.0.0",
  "structlog==26.1.0",
  "orjson==3.11.9",
  "python-multipart>=0.0.20,<1.0.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3,<10",
  "pytest-asyncio>=0.25,<2",
  "ruff>=0.11,<1",
]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
